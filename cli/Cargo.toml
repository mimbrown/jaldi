[package]
name = "jaldi"
description = "Lowers a framework's frontend — check, erase, minify, later bundle — behind a typed contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "jaldi"
path = "src/main.rs"

[dependencies]
jaldi-contract = { version = "0.3.0", path = "../contract" }
serde_json = "1"
sha2 = "0.10"
# TypeScript erasure: the types removed and nothing else.
oxc = { version = "0.155", features = ["transformer", "codegen", "semantic"] }
# Sheets: lowered to the browser floor and minified; rules read back as data.
lightningcss = { version = "1.0.0-alpha.72", features = ["sourcemap"] }
parcel_sourcemap = "2"
# The TypeScript 7 checker, in process. Not published; pinned by revision to the oxc-project repository.
tsrs_execute = { git = "https://github.com/oxc-project/tsrs", rev = "cb5f848c51905f1d22779db7e812e0578045ea1d" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", rev = "cb5f848c51905f1d22779db7e812e0578045ea1d" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", rev = "cb5f848c51905f1d22779db7e812e0578045ea1d" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", rev = "cb5f848c51905f1d22779db7e812e0578045ea1d" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs", rev = "cb5f848c51905f1d22779db7e812e0578045ea1d" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs", rev = "cb5f848c51905f1d22779db7e812e0578045ea1d" }

# Probe (#754), off by default: each engine as it would sit in the tool, so
# `cargo build --features …` measures what it adds. Not for merging.
jaldi-probe-linker = { path = "../probe/linker", optional = true }
jaldi-probe-rolldown = { path = "../probe/rolldown", optional = true }

[features]
probe-linker = ["dep:jaldi-probe-linker"]
probe-rolldown = ["dep:jaldi-probe-rolldown"]

[dev-dependencies]
tempfile = "3"
