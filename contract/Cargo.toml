[package]
name = "jaldi-contract"
description = "What crosses the boundary between a framework and jaldi, in both directions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The crate a framework compiles: nothing past the edition's floor, so a
# framework on an older stable than the tool's pin can still hold the
# contract (the tool's own floor is the workspace's, tsrs's).
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
